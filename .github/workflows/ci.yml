name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: twinlm_test
          POSTGRES_USER: twinlm_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twinlm_test -d twinlm_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # disposable CI database: migration, exchange and outbox tests use it
      TEST_DATABASE_URL: postgresql+psycopg://twinlm_test:test-only-password@localhost:5432/twinlm_test
      # disposable CI Redis: shared-state tests run against it instead of the fake
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # same as the Dockerfile base image
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip check
      - name: Offline suite + SDK contract + PostgreSQL migrations + real Redis
        run: python -m pytest -q
      - name: Codebase graph is current
        run: python scripts/codebase_graph.py
      - name: Dependency vulnerabilities
        run: pip install pip-audit && pip-audit --strict -r requirements.lock

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # type-checks and exports the web console

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose (every profile)
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile monitoring --profile ingress config --quiet
      - name: Alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m" prom/prometheus:v2.55.1 check rules /m/alerts.yml
      - name: Ingress config
        run: >-
          docker run --rm -e TWINLM_DOMAIN=api.localhost -e CONSOLE_DOMAIN=console.localhost
          -e GRAFANA_DOMAIN=grafana.localhost -e CONSOLE_USER=operator
          -e 'CONSOLE_PASSWORD_HASH=$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG'
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  build-smoke:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t twinlm:test .

  image:
    needs: [test, deploy-config]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
