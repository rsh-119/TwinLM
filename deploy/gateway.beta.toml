# TwinLM hosted beta (deploy/render-beta.yaml): free-tier models, shared by
# every beta team. GATEWAY_CONFIG_PATH=deploy/gateway.beta.toml.
#
# The providers' free tiers have account-wide limits (Groq: about 30 requests
# a minute, Gemini: per-model daily limits), shared by all beta users, so keys
# get low defaults and `auto` falls back between the two. Prices are list
# prices (verify them): free tiers aren't billed, but budgets need a price to
# stop spending.

request_timeout_seconds = 60
routing_strategy = "priority"
default_max_output_tokens = 1024     # bounds each request's worst case, so budgets hold

[retry]
max_retries = 1
backoff_base_seconds = 0.2
backoff_max_seconds = 2.0

[circuit_breaker]
failure_threshold = 5
cooldown_seconds = 30

[providers.gemini]
type = "gemini"
default_model = "gemini-3.1-flash-lite"
api_key_setting = "gemini_api_key"
timeout_seconds = 30
capabilities = ["chat", "tools", "vision"]

[providers.groq]
type = "openai_compatible"
base_url = "https://api.groq.com/openai/v1"
default_model = "openai/gpt-oss-20b"
api_key_setting = "groq_api_key"
timeout_seconds = 30
capabilities = ["chat", "tools"]

[models.auto]
targets = ["groq", "gemini"]
description = "Default: Groq first, Gemini when Groq is busy; image requests go to Gemini"

[models.fast]
targets = ["groq", "gemini"]
description = "Lowest latency first"

[models.smart]
targets = ["gemini", "groq"]
description = "General-purpose"

[pricing."gemini/gemini-3.1-flash-lite"]
input_per_million = 0.25
output_per_million = 1.50

[pricing."groq/openai/gpt-oss-20b"]
input_per_million = 0.075
output_per_million = 0.30

# What the savings report compares against (example price - verify it).
[pricing."openai/gpt-4o"]
input_per_million = 2.50
output_per_million = 10.00

[savings]
baseline = "openai/gpt-4o"

[rate_limits]
default_rpm = 10
default_tpm = 20000

[cache]
enabled = true
ttl_seconds = 600
max_entries = 2000

[guardrails]
max_input_chars = 50000

[guardrails.input]
secrets = "block"
pii = "log"
prompt_injection = "log"

[guardrails.output]
secrets = "redact"

[structured_output]
max_repair_attempts = 1
