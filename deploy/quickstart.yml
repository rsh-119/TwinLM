# TwinLM quickstart - no clone needed: gateway + PostgreSQL from published images.
#
#   curl -fsSLO https://raw.githubusercontent.com/rsh-119/TwinLM/main/deploy/quickstart.yml
#   echo "GEMINI_API_KEY=..." >> .env   # built-in gateway.toml uses Gemini + Groq
#   echo "GROQ_API_KEY=..." >> .env
#   docker compose -f quickstart.yml up -d
#   docker compose -f quickstart.yml exec gateway cat /run/secrets/admin_token
#
# Other providers (OpenAI, DeepSeek, Ollama...) or own routing/pricing:
# save a gateway.toml next to this file and uncomment the config mount below. Secrets are generated once into the `secrets`
# volume. The port binds to 127.0.0.1; put TLS in front for shared access
# (see docs/OPERATIONS.md, `ingress` profile of the full docker-compose.yml).

services:
  secrets:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -c
      - |
        for name in postgres_password admin_token provider_keys_secret; do
          [ -s /secrets/$$name ] || tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40 > /secrets/$$name
        done
        chmod 444 /secrets/*
    restart: "no"

  gateway:
    image: ${TWINLM_IMAGE:-ghcr.io/rsh-119/twinlm:latest}
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg://twinlm@postgres:5432/twinlm
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      # encrypts provider API keys added from the admin console
      PROVIDER_KEYS_SECRET_FILE: /run/secrets/provider_keys_secret
    volumes:
      - secrets:/run/secrets:ro
      - gateway-data:/app/data   # usage outbox - keep it
      # - ./gateway.toml:/app/gateway.toml:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        export ADMIN_TOKEN="$$(cat /run/secrets/admin_token)"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --proxy-headers
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"
    depends_on:
      secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: twinlm
      POSTGRES_USER: twinlm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinlm -d twinlm"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      secrets:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  secrets:
  gateway-data:
  postgres-data:
