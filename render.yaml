# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/rsh-119/TwinLM
# Runs the published image with a managed PostgreSQL. After deploy: copy
# ADMIN_TOKEN from the service's Environment tab, add provider keys there,
# then create gateway keys with POST /admin/keys.
services:
  - type: web
    name: twinlm
    runtime: image
    image:
      url: ghcr.io/rsh-119/twinlm:latest
    plan: starter
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: "8000"
      - key: AUTH_ENABLED
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PROVIDER_KEYS_SECRET   # encrypts provider keys added in the console
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: twinlm-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: twinlm-data
      mountPath: /app/data   # usage outbox survives restarts
      sizeGB: 1

databases:
  - name: twinlm-db
    databaseName: twinlm
    user: twinlm
    plan: basic-256mb
