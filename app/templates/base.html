<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TwinLM{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F5F6F7;
    --sidebar-bg: #ECEEF0;
    --surface: #FFFFFF;
    --text: #1B1F23;
    --muted: #6B7280;
    --border: #E2E4E8;
    --accent: #0F8A8C;
    --accent-text: #FFFFFF;
    --gemini: #5B8DEF;
    --groq: #E8935A;
    --danger: #C2452F;
    --danger-bg: #C2452F1A;
    --bubble-user: #0F8A8C1A;
    --bubble-assistant: #FFFFFF;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171A;
      --sidebar-bg: #191C1F;
      --surface: #1E2226;
      --text: #E7E9EC;
      --muted: #8B93A0;
      --border: #2A2F35;
      --accent: #2FB3B5;
      --accent-text: #08211F;
      --gemini: #7AA6F5;
      --groq: #F0A876;
      --danger: #E8735A;
      --danger-bg: #E8735A26;
      --bubble-user: #2FB3B526;
      --bubble-assistant: #1E2226;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Public Sans", system-ui, sans-serif;
    font-size: 15px;
  }
  h1, h2, h3, .brand, .nav-label, button, .composer select {
    font-family: "Space Grotesk", system-ui, sans-serif;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  a { color: var(--accent); }

  .app {
    display: flex;
    height: 100vh;
  }

  /* ---- sidebar ---- */
  .sidebar {
    width: 272px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-header {
    padding: 1.1rem 1.1rem 0.9rem;
  }
  .brand {
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .brand span { color: var(--accent); }
  .new-chat-form { padding: 0 1.1rem 0.8rem; }
  .new-chat {
    width: 100%;
    background: var(--accent);
    color: var(--accent-text);
  }
  .nav-label {
    padding: 0.6rem 1.1rem 0.3rem;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .conversation-list {
    display: flex;
    flex-direction: column;
    padding: 0 0.6rem 1rem;
    gap: 0.15rem;
    overflow-y: auto;
  }
  .conversation-item {
    display: block;
    padding: 0.55rem 0.6rem;
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.88rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
  }
  .conversation-item:hover { background: var(--border); }
  .conversation-item.active {
    background: var(--surface);
    border-color: var(--border);
    font-weight: 500;
  }
  .sidebar-empty {
    padding: 0 1.1rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ---- main pane ---- */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  form { margin: 0; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
  input, textarea, select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 0.7rem;
    font: inherit;
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 0.55rem 1rem;
    background: var(--border);
    color: var(--text);
    font-weight: 500;
    font-size: 0.88rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.96); }
  @media (prefers-color-scheme: dark) {
    button:hover { filter: brightness(1.15); }
  }

  .badge {
    display: inline-block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    padding: 0.12rem 0.4rem;
    border-radius: 5px;
    color: #fff;
  }
  .badge.tag-gemini { background: var(--gemini); }
  .badge.tag-groq { background: var(--groq); }

  @media (max-width: 720px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .main { height: auto; }
  }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <a class="brand" href="/">Twin<span>LM</span></a>
    </div>
    <form class="new-chat-form" method="post" action="/conversations">
      <button class="new-chat" type="submit">+ New conversation</button>
    </form>
    <div class="nav-label">Conversations</div>
    <nav class="conversation-list">
      {% for c in sidebar_conversations %}
      <a class="conversation-item{% if c.id == active_conversation_id %} active{% endif %}"
         href="/conversations/{{ c.id }}">{{ c.label }}</a>
      {% else %}
      <p class="sidebar-empty">Nothing yet - start one below.</p>
      {% endfor %}
    </nav>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
